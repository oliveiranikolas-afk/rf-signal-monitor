<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070A; }
  #overlay {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 12px 14px;
    font-family: monospace;
    color: #8B95A1;
    font-size: 11px;
    line-height: 1.5;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  #overlay b { color: #FFB020; }
  #hud {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 10px 14px 14px;
    font-family: monospace;
    color: #4EA1FF;
    font-size: 12px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="overlay">
  <div><b>Obstáculo: posição ilustrativa</b> — não é uma medição real de localização.</div>
  <div>Ondas refletem a variação real do seu RSSI, não o formato físico do ambiente.</div>
</div>
<div id="hud">RSSI: -- dBm · desvio: -- dB</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  let scene, camera, renderer, phoneMesh, obstacleMesh;
  let waves = [];
  const OBSTACLE_DIST = 4.2;
  const clock = new THREE.Clock();
  let lastAmbientWave = 0;

  function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x05070A, 0.045);

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(6, 4, 9);
    camera.lookAt(0, 0, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setClearColor(0x05070A, 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const grid = new THREE.GridHelper(16, 24, 0x1C2530, 0x141B22);
    grid.position.y = -0.01;
    scene.add(grid);

    scene.add(new THREE.AmbientLight(0x8899aa, 0.5));
    const pt = new THREE.PointLight(0x39FF88, 1.2, 20);
    pt.position.set(0, 3, 0);
    scene.add(pt);

    const phoneGeo = new THREE.SphereGeometry(0.18, 16, 16);
    const phoneMat = new THREE.MeshStandardMaterial({ color: 0x39FF88, emissive: 0x113322 });
    phoneMesh = new THREE.Mesh(phoneGeo, phoneMat);
    phoneMesh.position.set(0, 0.5, 0);
    scene.add(phoneMesh);

    const obsGeo = new THREE.BoxGeometry(1.4, 2.2, 0.5);
    const obsMat = new THREE.MeshStandardMaterial({
      color: 0xFFB020, transparent: true, opacity: 0.28,
      emissive: 0x2a1a00
    });
    obstacleMesh = new THREE.Mesh(obsGeo, obsMat);
    obstacleMesh.position.set(OBSTACLE_DIST, 1.1, 0);
    scene.add(obstacleMesh);
    const edges = new THREE.EdgesGeometry(obsGeo);
    const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0xFFB020 }));
    line.position.copy(obstacleMesh.position);
    scene.add(line);

    window.addEventListener("resize", onResize);
    animate();
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function spawnWave(origin, color, speed, maxRadius, reflect) {
    const geo = new THREE.SphereGeometry(0.05, 20, 20);
    const mat = new THREE.MeshBasicMaterial({ color: color, wireframe: true, transparent: true, opacity: 0.8 });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(origin);
    scene.add(mesh);
    waves.push({ mesh, radius: 0.05, origin: origin.clone(), speed, maxRadius, color, reflect, reflected: false });
  }

  function updateWaves(dt) {
    for (let i = waves.length - 1; i >= 0; i--) {
      const w = waves[i];
      w.radius += w.speed * dt;
      w.mesh.scale.setScalar(w.radius / 0.05);
      const t = w.radius / w.maxRadius;
      w.mesh.material.opacity = Math.max(0, 0.8 * (1 - t));

      if (w.reflect && !w.reflected) {
        const distToObstacle = obstacleMesh.position.distanceTo(w.origin);
        if (w.radius >= distToObstacle - 0.6) {
          w.reflected = true;
          spawnWave(obstacleMesh.position.clone(), 0xFFB020, w.speed * 0.85, 6, false);
        }
      }

      if (w.radius >= w.maxRadius) {
        scene.remove(w.mesh);
        waves.splice(i, 1);
      }
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.getElapsedTime();

    camera.position.x = Math.sin(t * 0.08) * 9;
    camera.position.z = Math.cos(t * 0.08) * 9;
    camera.lookAt(0, 0.8, 0);

    if (t - lastAmbientWave > 1.4) {
      lastAmbientWave = t;
      spawnWave(phoneMesh.position.clone(), 0x39FF88, 2.2, 10, true);
    }

    updateWaves(dt);
    renderer.render(scene, camera);
  }

  window.updateSignal = function(rssi, stdDev, movementFlag) {
    document.getElementById("hud").innerText =
      "RSSI: " + rssi.toFixed(1) + " dBm · desvio: " + stdDev.toFixed(2) + " dB" +
      (movementFlag ? "  ⚠ variação acima do limiar" : "");

    const intensity = Math.min(1, Math.max(0, (rssi + 90) / 50));
    phoneMesh.material.emissive.setHex(movementFlag ? 0x552200 : 0x113322);
    phoneMesh.scale.setScalar(0.9 + intensity * 0.4);

    if (movementFlag) {
      spawnWave(phoneMesh.position.clone(), 0xFF5C5C, 3.0, 10, true);
    }
  };

  init();
</script>
</body>
</html>
